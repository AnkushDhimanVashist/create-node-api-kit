name: Release

# Push a tag like v0.2.0 (`npm version patch && git push --follow-tags`).
# The workflow tests the package and *stages* it on npm. Nothing is public yet:
# approve it with your 2FA code to publish:
#   npx npm@12 stage list create-node-api-kit
#   npx npm@12 stage approve <stage-id>
# (or approve it on npmjs.com). Needs an NPM_TOKEN secret with publish rights.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      # `npm stage` needs npm 12+; Node 22 ships with npm 10.
      - run: npx -y npm@12 stage publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
